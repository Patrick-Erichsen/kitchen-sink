name: ClawHub Personal Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: clawhub-personal-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@main
    with:
      dry_run: false
      owner: patrick-erichsen-2
      ref: ${{ github.sha }}
      source_ref: ${{ github.ref }}
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
